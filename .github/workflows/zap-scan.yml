name: OWASP ZAP DAST Scan

on:
  workflow_dispatch:

jobs:
  zap_scan:
    name: ZAP DAST Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read      # read repo only
      issues: write       # create issues for findings

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Create isolated output directory owned by runner
      # ZAP only writes here — not to the full workspace
      - name: Create ZAP output directory
        run: |
          mkdir -p ${{ github.workspace }}/zap-reports
          chmod 777 ${{ github.workspace }}/zap-reports

      - name: Pull ZAP Docker image
        run: docker pull ghcr.io/zaproxy/zaproxy:stable

      # -I = do not fail even when warnings are found
      - name: Run ZAP Baseline Scan
        run: |
          docker run --rm \
            --user $(id -u):$(id -g) \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            -v ${{ github.workspace }}/zap-reports:/zap/wrk:rw \
            --network host \
            --read-only \
            --tmpfs /tmp \
            --tmpfs /zap/home \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t ${{ secrets.TARGET_URL }} \
            -J report_json.json \
            -w report_md.md \
            -r report_html.html \
            -I
        continue-on-error: true

      - name: Verify report files
        if: always()
        run: |
          echo "=== ZAP reports directory ==="
          ls -la ${{ github.workspace }}/zap-reports/
          echo "=== Find report files ==="
          find ${{ github.workspace }}/zap-reports -name "report*" 2>/dev/null

      - name: Upload ZAP Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-report-${{ github.run_id }}
          path: ${{ github.workspace }}/zap-reports/
          if-no-files-found: warn
