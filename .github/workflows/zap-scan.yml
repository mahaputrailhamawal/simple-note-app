name: OWASP ZAP DAST Scan

on:
  workflow_dispatch:

jobs:
  zap_scan:
    name: ZAP DAST Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create ZAP output directory
        run: mkdir -p ${{ github.workspace }}/zap-reports

      - name: Pull ZAP Docker image
        run: docker pull ghcr.io/zaproxy/zaproxy:stable

      - name: Run ZAP Baseline Scan
        run: |
          docker run --rm \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            -v ${{ github.workspace }}/zap-reports:/zap/wrk:rw \
            --network host \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t ${{ secrets.TARGET_URL }} \
            -J report_json.json \
            -w report_md.md \
            -r report_html.html \
            --autooff \
            -I
        continue-on-error: true

      - name: Fix report ownership
        if: always()
        run: |
          sudo chown -R $USER:$USER \
            ${{ github.workspace }}/zap-reports/

      - name: Verify report files
        if: always()
        run: |
          echo "=== ZAP reports ==="
          ls -la ${{ github.workspace }}/zap-reports/

      - name: Upload ZAP Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-report-${{ github.run_id }}
          path: ${{ github.workspace }}/zap-reports/
          if-no-files-found: warn
