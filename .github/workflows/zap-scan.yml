name: OWASP ZAP DAST Scan

on:
  workflow_dispatch:

jobs:
  zap_scan:
    name: ZAP DAST Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Pull ZAP Docker image
        run: docker pull ghcr.io/zaproxy/zaproxy:stable

      # No volume mount — ZAP writes internally
      # No --rm so container persists for docker cp
      - name: Run ZAP Baseline Scan
        run: |
          docker run \
            --name zap_runner \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --network host \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t ${{ secrets.TARGET_URL }} \
            -J /zap/wrk/report_json.json \
            -w /zap/wrk/report_md.md \
            -r /zap/wrk/report_html.html \
            -I
        continue-on-error: true

      # Copy files out from stopped container
      - name: Extract reports from container
        if: always()
        run: |
          mkdir -p ${{ github.workspace }}/zap-reports
          docker cp zap_runner:/zap/wrk/report_html.html \
            ${{ github.workspace }}/zap-reports/ || echo "report_html not found"
          docker cp zap_runner:/zap/wrk/report_json.json \
            ${{ github.workspace }}/zap-reports/ || echo "report_json not found"
          docker cp zap_runner:/zap/wrk/report_md.md \
            ${{ github.workspace }}/zap-reports/ || echo "report_md not found"

      - name: Cleanup container
        if: always()
        run: docker rm -f zap_runner || true

      - name: Verify report files
        if: always()
        run: |
          echo "=== ZAP reports ==="
          ls -la ${{ github.workspace }}/zap-reports/

      - name: Upload ZAP Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-report-${{ github.run_id }}
          path: ${{ github.workspace }}/zap-reports/
          if-no-files-found: warn
